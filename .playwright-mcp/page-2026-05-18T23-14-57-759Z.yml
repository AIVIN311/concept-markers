                                  - paragraph [ref=e1287]:
                                    - generic [ref=e1288]:
                                      - text: Most smartphone operating systems today are overloaded with distractions, duplicate apps, aggressive notifications, and heavy software layers that slowly ruin the user experience.
                                      - text: "NovaOS is being built with a different philosophy:"
                                      - text: Technology should feel lighter, faster, cleaner, and more human.
                                      - text: "Our goal is to create an AI-first operating system experience focused on:"
                                      - text: Performance optimization
                                      - text: Minimal and intentional design
                                      - text: Faster everyday workflows
                                      - text: Better battery efficiency
                                      - text: Smarter interactions without unnecessary complexity
                                      - text: "This video highlights one simple idea:"
                                      - text: Even small improvements in speed and usability can completely change how people experience their mornings, work, and daily life.
                                      - text: We’re not trying to build “just another Android skin.”
                                      - text: We’re building an ecosystem experience designed for the next era of computing.
                                      - text: Still early. Still building. But the vision is clear.
                                      - text: NovaOS by InfYNova.
