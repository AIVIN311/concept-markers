                                      - text: AIPost Night Talk 2｜設計 x AI 的夜晚 (English below)
                                      - text: "昨天（7月9日）非常榮幸主持了 AIPost Night Talk #2，與三位設計界的重量級講者，圍繞「從設計視角看AI浪潮下的設計思維變革」展開了一場精彩又充滿洞見的對談。"
                                      - text: 這場輕鬆卻深度的線上AMA，我們邀請了：
                                      - link "Ming Wen" [ref=e686]:
                                        - /url: https://www.linkedin.com/in/cis2042/zh/
                                      - text: ｜國立台北商業大學教授 & UX三刀流主理人
                                      - link "Seal Chang" [ref=e687]:
                                        - /url: https://www.linkedin.com/in/wasiseal/
                                      - text: ｜KKDAY Head of Product & Growth Hack專家
                                      - link "Fangyi Su" [ref=e688]:
                                        - /url: https://www.linkedin.com/in/fangyi-su/
                                      - text: ｜MobileDrive 資深UI設計師，橫跨多元產業設計經驗
                                      - text: 我們談論了：
                                      - text: ☑️ AI 對 UI/UX 與產品流程的重構力量
                                      - text: ☑️ 設計工具的演進與創意訓練的新方式
                                      - text: ☑️ 面對AI浪潮，設計師如何重新思考「設計思維」的核心
                                      - text: 感謝三位嘉賓的真誠分享與實戰經驗，這場夜談不只收穫滿滿，也讓許多未來人得到了深刻啟發。
                                      - link "AIPost｜AI郵報" [ref=e689]:
                                        - /url: https://www.linkedin.com/company/ai郵報/
                                      - text: 會持續舉辦更多針對未來趨勢與專業實務的分享，歡迎關注我們、一起加入這場AI驅動的變革！
