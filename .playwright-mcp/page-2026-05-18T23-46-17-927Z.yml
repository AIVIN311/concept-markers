                                - 'link "上週在政大創聯會與商學院的『創業家講座』中分享關於AI趨勢下的創業方法與個人創業的心路歷程酸甜苦辣，目的是讓同學們可以趨吉避凶。 今天收到創聯會針對講座後同學們的回饋，覺得是近期在校園分享裡面非常有共鳴跟提問很有深度的一場，果然是創業風氣也很盛的政大！ 張哲維 講師 您好： 非常感謝您於上週四前來參與「創業家講座」！藉由您平易近人的創業經驗講授方式與對 AI 、新創趨勢的獨到見解讓本場講座收穫許多與會者的好評。在講者個別分享環節，您針對「 AI 時代下的創業的護城河」與「 FOMO 」，讓聽眾對 AI 的可近性有深刻的體悟，我們課程組全體成員亦獲益良多！ 以下是本次講座的回饋供講師參考 ： 整體回饋摘要： ✅學員普遍認為您分享的創業思維務實、具體且相當有深度，特別是關於「資源累積」、「資料護城河」、「市場現實」等面向。 ✅您的分享涵蓋大量真實創業經驗、失敗案例與策略洞察，讓與會者感覺有深刻揭露創業的真實現場。 ✅多則回饋提到您的分享讓他們對創業動機、資源累積、行動力有更深反思。 精選學員回饋： ✅很讚同張哲維講師說創業，手握人生的方向盤，自由掌握自己的時間，最大化收益是創業的初衷。 ✅認同講師說 AI 是最大的「不公平優勢」。 ✅講師講述 AI 輔助創業與市場競爭的邏輯非常清晰，是第一次聽到這麼實際的解說。 ✅他從面試官視角談如何跨進科技業，讓我覺得很接地氣，也很有方向。 ✅講師鼓勵我們多做專案、累積實績，比本科背景更重要。 ✅講師強調要累積「credibility」而不是去追求形式的實習，這很實用。 #AI #人工智慧 #創業 #創業心法 #Startup #政治大學 #NCCU" [ref=e1419] [cursor=pointer]':
                                  - /url: https://www.linkedin.com/feed/update/urn:li:activity:7399699201049260032/
                                  - paragraph [ref=e1420]:
                                    - generic [ref=e1421]:
                                      - text: 上週在政大創聯會與商學院的『創業家講座』中分享關於AI趨勢下的創業方法與個人創業的心路歷程酸甜苦辣，目的是讓同學們可以趨吉避凶。 今天收到創聯會針對講座後同學們的回饋，覺得是近期在校園分享裡面非常有共鳴跟提問很有深度的一場，果然是創業風氣也很盛的政大！
                                      - text: 張哲維 講師 您好：
                                      - text: 非常感謝您於上週四前來參與「創業家講座」！藉由您平易近人的創業經驗講授方式與對 AI 、新創趨勢的獨到見解讓本場講座收穫許多與會者的好評。在講者個別分享環節，您針對「 AI 時代下的創業的護城河」與「 FOMO 」，讓聽眾對 AI 的可近性有深刻的體悟，我們課程組全體成員亦獲益良多！
                                      - text: 以下是本次講座的回饋供講師參考 ：
                                      - text: 整體回饋摘要：
                                      - text: ✅學員普遍認為您分享的創業思維務實、具體且相當有深度，特別是關於「資源累積」、「資料護城河」、「市場現實」等面向。
                                      - text: ✅您的分享涵蓋大量真實創業經驗、失敗案例與策略洞察，讓與會者感覺有深刻揭露創業的真實現場。
                                      - text: ✅多則回饋提到您的分享讓他們對創業動機、資源累積、行動力有更深反思。
                                      - text: 精選學員回饋：
                                      - text: ✅很讚同張哲維講師說創業，手握人生的方向盤，自由掌握自己的時間，最大化收益是創業的初衷。
                                      - text: ✅認同講師說 AI 是最大的「不公平優勢」。
                                      - text: ✅講師講述 AI 輔助創業與市場競爭的邏輯非常清晰，是第一次聽到這麼實際的解說。
                                      - text: ✅他從面試官視角談如何跨進科技業，讓我覺得很接地氣，也很有方向。
                                      - text: ✅講師鼓勵我們多做專案、累積實績，比本科背景更重要。
                                      - text: ✅講師強調要累積「credibility」而不是去追求形式的實習，這很實用。
