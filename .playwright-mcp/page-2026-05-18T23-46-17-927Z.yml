                                      - text: AIPost Night Talk 2｜AI Meets Design Thinking
                                      - text: "On July 9th, I had the honor of hosting AIPost Night Talk #2, where we explored the timely and forward-looking topic:“Design Thinking in the Age of AI: A Designer’s Perspective.” We were joined by three outstanding guests:"
                                      - link "Ming Wen" [ref=e698]:
                                        - /url: https://www.linkedin.com/in/cis2042/zh/
                                      - text: ｜Professor at National Taipei University of Business & Founder of UX三刀流
                                      - link "Seal Chang" [ref=e699]:
                                        - /url: https://www.linkedin.com/in/wasiseal/
                                      - text: ｜Head of Product at KKDAY & Growth Hacking Expert
                                      - link "Fangyi Su" [ref=e700]:
                                        - /url: https://www.linkedin.com/in/fangyi-su/
                                      - text: ｜Senior UI Designer at MobileDrive, with diverse industry experience
                                      - text: "Key topics we covered:"
                                      - text: ☑️ How AI is reshaping UI/UX and the entire product development process
                                      - text: ☑️ The evolution of design tools in the AI era
                                      - text: ☑️ Rethinking the essence of design thinking in response to emerging technologies
                                      - text: Huge thanks to our guests for their genuine insights and inspiring stories. The conversation sparked deep reflections and forward-looking ideas for many of us building for the future.
                                      - link "AIPost｜AI郵報" [ref=e701]:
                                        - /url: https://www.linkedin.com/company/ai郵報/
                                      - text: will continue to host events like this to inspire the next generation of future-minded creators. Stay tuned and join the movement!
