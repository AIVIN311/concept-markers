                        - listitem [ref=e766]:
                          - listitem [ref=e767]:
                            - 'link "貼文 很榮幸受邀參與《2025鼎新企業高峰年會 | 製造場》的主題對談：「用數智實現創想」，與產官學界的先進們共同探討 AI 如何重構製造業的創新生產力。 從「導入AI」到「AI Inside」，不僅是工具的更替，更是組織底層邏輯與文化的轉型。 在論壇中，我分享了以下幾個觀點： - 對中小企業而言，導入AI的起點不是技術，而是數據治理與現場理解。 - 台灣製造業的最大資產，是現場經驗的厚度與學習韌性，AI應該做的是放大這份能力，而不是取代。 - 未來的競爭力來自於「數據驅動」與「決策即時化」的能力，這需要策略、人才、與文化的三位一體推動。 - 以及2028前在Agentic AI、Multimodal、IOT間的交互應用 非常感謝鼎新數智的邀請，以及與會夥伴精彩的交流與洞察。未來，我也將持續關注 AI 在製造業、商業與法規面向的融合應用。 #AI #智慧製造 #製造業轉型 #企業數位轉型 #鼎新企業高峰年會 #AIInside #產業創新 #Digiwin #人工智慧 #數位轉型 #SmartManufacturing 9 個感受" [ref=e770] [cursor=pointer]':
                              - /url: https://www.linkedin.com/feed/update/urn:li:activity:7318513513264463872/
                              - generic [ref=e771]:
                                - button "貼文" [ref=e772]
                                - generic [ref=e773]:
                                  - paragraph [ref=e775]:
                                    - generic [ref=e776]:
                                      - text: 很榮幸受邀參與《2025鼎新企業高峰年會 | 製造場》的主題對談：「用數智實現創想」，與產官學界的先進們共同探討 AI 如何重構製造業的創新生產力。
                                      - text: 從「導入AI」到「AI Inside」，不僅是工具的更替，更是組織底層邏輯與文化的轉型。
                                      - text: 在論壇中，我分享了以下幾個觀點：
                                      - text: "- 對中小企業而言，導入AI的起點不是技術，而是數據治理與現場理解。"
                                      - text: "- 台灣製造業的最大資產，是現場經驗的厚度與學習韌性，AI應該做的是放大這份能力，而不是取代。"
                                      - text: "- 未來的競爭力來自於「數據驅動」與「決策即時化」的能力，這需要策略、人才、與文化的三位一體推動。"
                                      - text: "- 以及2028前在Agentic AI、Multimodal、IOT間的交互應用"
                                      - text: 非常感謝鼎新數智的邀請，以及與會夥伴精彩的交流與洞察。未來，我也將持續關注 AI 在製造業、商業與法規面向的融合應用。
