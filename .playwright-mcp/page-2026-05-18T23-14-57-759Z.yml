                                    - generic [ref=e690]:
                                      - text: Last week, I attended the AI Impact Summit Expo 2026 at Bharat Mandapam, not as a spectator, but as a student founder working on an AI-native smartphone ecosystem from India.
                                      - text: Over five days, I engaged in 50+ meaningful conversations with startup founders, corporate strategists, government officials, and AI researchers. I connected with leaders from enterprise tech, policy circles, and innovation teams.
                                      - text: What stood out to me was the realization that AI is no longer just a “feature.” It has evolved into infrastructure, policy, hardware, and sovereignty. This understanding reinforced my motivation for starting
                                      - link "InfYNova" [ref=e691]:
                                        - /url: https://www.linkedin.com/company/infynova/
                                      - text: .
                                      - text: "InfYNova is an early-stage deep-tech venture focused on creating an AI-first smartphone ecosystem, powered by our custom Android-based layer, NovaOS. Currently, we are working on:"
                                      - text: • NovaOS architecture and system apps development
                                      - text: • AI-native integration strategy
                                      - text: • Website and ecosystem positioning
                                      - text: • Market validation and strategic networking
                                      - text: We are pre-revenue and in the early stages, but we are committed to our vision. The summit not only validated our idea but also sharpened our direction. Discussions with enterprise leaders and policy researchers highlighted the need for controlled AI ecosystems in India, rather than mere app-level integrations.
                                      - text: I am now actively seeking incubation support, strategic mentorship, and partnerships within the deep-tech ecosystem to accelerate the next phase of our journey — refining our prototype and executing a structured product roadmap.
                                      - text: If you are involved in an incubator, accelerator, or deep-tech innovation program focused on AI, hardware, or OS-level innovation, I would appreciate the opportunity to connect.
                                      - text: Building infrastructure takes time, but the foundation is being laid.
