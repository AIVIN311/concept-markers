                                      - text: "Leadership gets romanticized: TED talks, boardrooms, 100-person teams."
                                      - text: "Solo-founder truth: It's saying NO 97% of the time. Leading yourself first."
                                      - text: "NovaOS lessons after 14 months solo:"
                                      - text: 1. "Shiny" kills velocity
                                      - text: Shiny AI models? Cool. But wakelock drain first. Shipped v0.1.4 Saturday 3AM because I killed 12 "nice-to-haves."
                                      - text: 2. Metrics > motivation
                                      - text: "Track: Lines deployed (847 yesterday), drain % (0.8/hr), investor decks sent (29). Moods don't ship code."
                                      - text: 3. Network compounds silently
                                      - text: Cold DM'd 47 devs. 3 became ESP32 beta testers. 1 Meesho supplier → PCB discounts. No "networking events."
                                      - text: 4. Burnout is poor scheduling
                                      - text: 90min blocks. 8hr cap. Sundays sacred.
                                      - link "B.Tech" [ref=e1511]:
                                        - /url: https://www.linkedin.com/safety/go/?url=http%3A%2F%2FB%2ETech&urlhash=4dZl&mt=OgO5hasS8t8g2MDvMxL228B20SM9T4xKeTScPsAwbTe83WG7dsZQI-yYf6MrbeURoNhLxf1EOJRuc8ncZYj0xmBB5-fL5wqwQGbp91xou7lFVOl5PWWqUAgR1IA&isSdui=true
                                        - strong [ref=e1513]: B.Tech
                                      - text: exams don't wait for "founder energy."
                                      - text: 5. Validation is a trap
                                      - text: No users? Ship anyway. Xperia boots clean now. First 10 testers next week. Feedback loops after velocity.
                                      - text: Leadership = systems that force right decisions when you're tired, rejected, broke.
                                      - text: Most "leaders" delegate. Solo leaders execute.
                                      - text: "Question: What's the hardest \"NO\" you said this week to protect velocity?"
